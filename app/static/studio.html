 });

async function toggleRecord(target){
  if(state.activeRecording){notify('Finish the current voice recording first.',true);return}
  if(!canRecord()){notify('Microphone access requires a supported browser and localhost or HTTPS.',true);return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    state.stream=stream;state.recordTarget=target;state.recordChunks=[];
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x))||'';
    const recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
    state.recorder=recorder;state.activeRecording=true;
    const modalRoot=$('#modalRoot');modalRoot.replaceChildren();
    const shade=el('div','modalBack'),panel=el('section','modal');
    panel.append(el('h2',null,'Record a voice note'));
    const status=el('p','sub','Recording…'),actions=el('div','composeBottom');
    const clock=el('div','voiceClock','00:00');clock.setAttribute('role','timer');clock.setAttribute('aria-label','Voice recording duration');
    let elapsed=0,segmentStart=performance.now(),clockTimer=null;
    const displayTime=()=>{const seconds=Math.floor((elapsed+(recorder.state==='recording'?(performance.now()-segmentStart):0))/1000);clock.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')};
    const stopClock=()=>{if(clockTimer!==null){clearInterval(clockTimer);clockTimer=null}};
    clockTimer=setInterval(displayTime,250);
    const toggle=btn('Ⅱ Pause',()=>{if(recorder.state==='recording'){elapsed+=performance.now()-segmentStart;recorder.pause();displayTime();status.textContent='Paused — nothing new is being recorded';toggle.textContent='▶ Resume'}else if(recorder.state==='paused'){segmentStart=performance.now();recorder.resume();status.textContent='Recording…';toggle.textContent='Ⅱ Pause'}},'btn small');
    const finish=btn('■ Stop and listen',()=>{if(recorder.state!=='inactive')recorder.stop()},'btn primary small');
    const cancel=btn('Cancel',()=>{stopClock();recorder.onstop=null;if(recorder.state!=='inactive')recorder.stop();stream.getTracks().forEach(t=>t.stop());state.activeRecording=false;state.recorder=null;modalRoot.replaceChildren()},'btn small');
    actions.append(toggle,finish,cancel);panel.append(clock,status,actions);shade.append(panel);modalRoot.append(shade);
    recorder.ondataavailable=e=>{if(e.data.size)state.recordChunks.push(e.data)};
    recorder.onstop=()=>{
      if(recorder.state==='inactive'&&status.textContent.startsWith('Recording'))elapsed+=performance.now()-segmentStart;stopClock();displayTime();
      stream.getTracks().forEach(t=>t.stop());state.activeRecording=false;state.recorder=null;
      const type=recorder.mimeType||'audio/webm',ext=type.includes('mp4')?'m4a':'webm';
      const file=new File(state.recordChunks,`voice-note-${Date.now()}.${ext}`,{type});
      const audio=el('audio');audio.controls=true;audio.preload='metadata';const objectUrl=URL.createObjectURL(file);audio.src=objectUrl;
      status.textContent='Listen to your recording before sending.';actions.replaceChildren();panel.insertBefore(audio,actions);
      actions.append(btn('＋ Add to message',()=>{attachSelected([file],target);URL.revokeObjectURL(objectUrl);modalRoot.replaceChildren();notify('Voice note attached. Press Send when ready.')} ,'btn primary small'));
      actions.append(btn('↻ Re-record',()=>{URL.revokeObjectURL(objectUrl);modalRoot.replaceChildren();toggleRecord(target)},'btn small'));
      actions.append(btn('Delete',()=>{URL.revokeObjectURL(objectUrl);modalRoot.replaceChildren()},'btn small'));
    };
    recorder.start(500);
  }catch(e){notify('Microphone unavailable: '+e.message,true)}
}

   msg.textContent='Loading checks…';
   try{const checks=await api(base+'/followups/'+encodeURIComponent(f.id)+'/checks');msg.textContent='Saved checks: '+(Array.isArray(checks)?checks.length:0);
    const list=el('div');for(const c of (Array.isArray(checks)?checks:[])){const detail=el('details','specialistRecord');detail.append(el('summary',null,'Check '+String(c.check_id||'').slice(0,10)+' · '+(c.passed===true?'Passed':c.passed===false?'Failed':'Unspecified')));const p=el('pre');p.textContent=JSON.stringify(c,null,2);detail.append(p);list.append(detail)}d.append(list)
   }catch(e){msg.textContent=e.message;msg.classList.add('error')}
  },'btn small');
  d.append(show,msg);followSection.append(d);
 }
}


// Council and Model Lab: saved outputs, no invented multi-provider evaluations.
function councilText(parent,label,value){
 const d=el('div','specialistRecord');d.append(el('strong',null,label));
 const p=el('p');p.style.whiteSpace='pre-wrap';p.textContent=String(value??'Not recorded');d.append(p);parent.append(d);return d;
}
function councilCompare(parent,passes){
 const items=Array.isArray(passes)?passes:[];
 if(!items.length){parent.append(el('p','specialistMuted','No analytical passes in this report.'));return}
 const grid=el('div','specialistMetrics');
 for(const pass of items){const card=el('div','specialistMetric');card.style.minWidth='200px';card.style.flex='1';card.append(el('strong',null,pass.name||'Review pass'));const p=el('p');p.style.whiteSpace='pre-wrap';p.textContent=pass.assessment||'No assessment';card.append(p);grid.append(card)}
 parent.append(grid);
}
function councilDetailedWorkspace(host,pid){
 const area=el('section','specialistSection');area.append(el('h3',null,'AI Council · perspective comparison'),el('p','specialistMuted','Three calls to the same configured AI model. These are analytical perspectives, not independent expert systems or a model benchmark.'));host.append(area);
 const status=el('p','status');area.append(status);
 api('/api/projects/'+encodeURIComponent(pid)+'/ai-council/reports').then(reports=>{
  if(!Array.isArray(reports)||!reports.length){area.append(el('p','specialistMuted','No saved Council reports. Use Run Council review above to create one from real evidence.'));return}
  const select=el('select');select.setAttribute('aria-label','Council report');
  for(const r of reports){const option=el('option',null,(r.created_at||'Saved report')+' · '+(r.question||'').slice(0,90));option.value=r.id;select.append(option)}
  const detail=el('div','specialistForm');area.append(select,detail);
  const render=()=>{const r=reports.find(x=>x.id===select.value);detail.replaceChildren();if(!r)return;
   detail.append(el('h3',null,r.question||'Council review'));
   const meta=el('p','specialistMuted','Report '+r.id+' · '+(r.created_at||''));detail.append(meta);
   councilCompare(detail,r.perspectives);
   councilText(detail,'Council synthesis',r.synthesis);
   const evidence=el('details','specialistRecord');evidence.append(el('summary',null,'Evidence and simulation IDs used'));
   for(const x of r.sources||[])evidence.append(el('p',null,(x.filename||'Source')+' · '+x.id));
   for(const id of r.simulation_ids||[])evidence.append(el('p',null,'Simulation · '+id));
   if(!(r.sources||[]).length&&!(r.simulation_ids||[]).length)evidence.append(el('p','specialistMuted','No source IDs recorded.'));
   detail.append(evidence);
   const limitations=el('details','specialistRecord');limitations.append(el('summary',null,'Limitations and human verification'));for(const x of r.limitations||[])limitations.append(el('p',null,'• '+x));detail.append(limitations);
  };select.onchange=render;render();
 }).catch(e=>{status.textContent='Council reports unavailable: '+e.message;status.classList.add('error')});
}
function metaModelDetailedWorkspace(host,pid){
 const area=el('section','specialistSection');area.append(el('h3',null,'Meta Model Lab · saved output comparison'),el('p','specialistMuted','Inventory and compare existing outputs. This does not run independent models or measure accuracy, latency or cost.'));host.append(area);
 const status=el('p','status');area.append(status);
 api('/api/projects/'+encodeURIComponent(pid)+'/model-lab/saved').then(data=>{
  const reports=Array.isArray(data.saved_council_reports)?data.saved_council_reports:[];
  const messages=Array.isArray(data.assistant_response_records)?data.assistant_response_records:[];
  const metrics=el('div','specialistMetrics');for(const [label,value] of [['Saved Council reports',reports.length],['Saved assistant responses',messages.length]]){const m=el('div','specialistMetric');m.append(el('strong',null,String(value)),el('small',null,label));metrics.append(m)}area.append(metrics);
  const panel=el('div','specialistForm');area.append(panel);
  if(!reports.length){panel.append(el('p','specialistMuted','No Council reports available for side-by-side comparison.'));return}
  const selectA=el('select'),selectB=el('select');
  for(const select of [selectA,selectB]){select.setAttribute('aria-label',select===selectA?'First saved Council report':'Second saved Council report');for(const r of reports){const o=el('option',null,(r.created_at||'Saved')+' · '+(r.question||'').slice(0,70));o.value=r.id;select.append(o)}}
  if(reports.length>1)selectB.selectedIndex=1;
  const cols=el('div','specialistMetrics');panel.append(el('h3',null,'Compare saved Council syntheses'),selectA,selectB,cols);
  const render=()=>{cols.replaceChildren();for(const [label,select] of [['Report A',selectA],['Report B',selectB]]){const r=reports.find(x=>x.id===select.value);const card=el('div','specialistMetric');card.style.flex='1';card.style.minWidth='220px';card.append(el('strong',null,label),el('p',null,r?.question||'No question'));const p=el('p');p.style.whiteSpace='pre-wrap';p.textContent=r?.synthesis||'No synthesis';card.append(p);cols.append(card)}};
  selectA.onchange=render;selectB.onchange=render;render();
  panel.append(el('p','specialistMuted','Differences are shown as recorded. Repeated AI output is not independent corroboration.'));
  const inventory=el('details','specialistRecord');inventory.append(el('summary',null,'Saved assistant response inventory ('+messages.length+')'));
  for(const m of messages.slice(0,30))inventory.append(el('p',null,(m.created_at||'')+' · '+m.id+' · '+(m.role||'assistant')));
  panel.append(inventory);
 }).catch(e=>{status.textContent='Model Lab inventory unavailable: '+e.message;status.classList.add('error')});
}


// Afterlight operational workspace: project-scoped jobs, schedules, notices and recovery.
// This view does not claim a durable worker or an active background scheduler.
async function afterlightDetailedWorkspace(host,pid,reload){
 const base='/api/projects/'+encodeURIComponent(pid)+'/afterlight';
 const section=el('section','specialistSection');host.append(section);
 section.append(el('h3',null,'Afterlight · monitoring and recovery'),el('p','specialistMuted','Review actual saved investigations, schedule configuration and notifications. Execution depends on the local server and its scheduler; schedules are not guaranteed to run while the server is offline.'));
 const notice=el('p','status');section.append(notice);
 const data=await Promise.allSettled(['jobs','schedules','notices','recovery'].map(k=>api(base+'/'+k)));
 const values={};['jobs','schedules','notices','recovery'].forEach((k,i)=>{if(data[i].status==='fulfilled')values[k]=data[i].value;else values[k]=null});
 const jobs=Array.isArray(values.jobs)?values.jobs:[];
 const schedules=Array.isArray(values.schedules)?values.schedules:[];
 const notices=Array.isArray(values.notices?.notices)?values.notices.notices:[];
 const recovery=values.recovery;
 const metrics=el('div','specialistMetrics');
 for(const [label,value] of [['Investigations',jobs.length],['Running / queued',jobs.filter(j=>['running','queued'].includes(j.status)).length],['Schedules',schedules.length],['Unread notices',notices.filter(n=>!n.is_read).length]]){
  const m=el('div','specialistMetric');m.append(el('strong',null,String(value)),el('small',null,label));metrics.append(m)
 }
 section.append(metrics);
 const form=el('div','specialistForm');form.append(el('h3',null,'Start an evidence investigation'));
 const question=el('textarea');question.placeholder='What should Afterlight investigate? (10–1500 characters)';question.maxLength=1500;
 const start=btn('Start investigation',async()=>{start.disabled=true;notice.textContent='Submitting investigation…';try{await json(base+'/jobs',{question:question.value.trim()});notice.textContent='Investigation queued.';await reload()}catch(e){notice.textContent=e.message;notice.classList.add('error')}finally{start.disabled=false}},'btn primary small');
 form.append(question,start);section.append(form);
 const scheduleBox=el('div','specialistForm');scheduleBox.append(el('h3',null,'Scheduled investigations'),el('p','specialistMuted','Intervals are 15 minutes to 7 days. The server must be running for scheduled dispatch.'));
 const sq=el('textarea');sq.placeholder='Recurring investigation question';sq.maxLength=1500;
 const interval=el('input');interval.type='number';interval.min='15';interval.max='10080';interval.value='1440';interval.setAttribute('aria-label','Interval in minutes');
 const scheduleBtn=btn('Create schedule',async()=>{scheduleBtn.disabled=true;notice.textContent='Saving schedule…';try{await json(base+'/schedules',{question:sq.value.trim(),interval_minutes:Number(interval.value)});await reload()}catch(e){notice.textContent=e.message;notice.classList.add('error')}finally{scheduleBtn.disabled=false}},'btn small');
 scheduleBox.append(sq,el('p','specialistMuted','Interval in minutes'),interval,scheduleBtn);
 for(const sc of schedules){const row=el('details','specialistRecord');row.append(el('summary',null,(sc.enabled?'Enabled':'Paused')+' · every '+sc.interval_minutes+' min · '+String(sc.question||'').slice(0,95)));
  row.append(el('p','specialistMuted','Next planned run: '+(sc.next_run_at||'Not set')));
  const toggle=btn(sc.enabled?'Pause schedule':'Enable schedule',async()=>{toggle.disabled=true;try{await json(base+'/schedules/'+encodeURIComponent(sc.id)+'/toggle',{enabled:!Boolean(sc.enabled)});await reload()}catch(e){notice.textContent=e.message;notice.classList.add('error')}finally{toggle.disabled=false}},'btn small');row.append(toggle);scheduleBox.append(row)
 }
 if(!schedules.length)scheduleBox.append(el('p','specialistMuted','No recurring schedules saved.'));
 section.append(scheduleBox);
 // Operational charts use saved investigation records, not synthetic monitoring data.
 const monitoring=el('div','specialistForm');monitoring.append(el('h3',null,'Investigation status distribution'));
 const statuses=['queued','running','completed','failed','interrupted'];
 const counts=statuses.map(k=>jobs.filter(j=>String(j.status||'').toLowerCase()===k).length);
 const maximum=Math.max(1,...counts);
 const graph=el('div');graph.setAttribute('role','img');graph.setAttribute('aria-label','Investigation counts by status: '+statuses.map((k,i)=>k+' '+counts[i]).join(', '));
 for(let i=0;i<statuses.length;i++){
  const r=el('div');r.style.cssText='display:grid;grid-template-columns:92px 1fr 34px;align-items:center;gap:10px;margin:8px 0';
  const name=el('span','specialistMuted',statuses[i]);
  const track=el('div');track.style.cssText='height:12px;border-radius:8px;background:var(--border,rgba(128,128,128,.18));overflow:hidden';
  const fill=el('div');fill.style.cssText='height:100%;width:'+((counts[i]/maximum)*100)+'%;background:var(--accent,#21b7a8);border-radius:8px';
  track.append(fill);r.append(name,track,el('strong',null,String(counts[i])));graph.append(r)
 }
 monitoring.append(graph);
 const chronological=jobs.filter(j=>j.created_at||j.updated_at).slice().sort((a,b)=>String(b.created_at||b.updated_at).localeCompare(String(a.created_at||a.updated_at))).slice(0,15);
 if(chronological.length){
  const timeline=el('details','specialistRecord');timeline.append(el('summary',null,'Recent investigation activity · '+chronological.length+' entries'));
  for(const j of chronological){const item=el('div');item.style.cssText='border-left:2px solid var(--accent,#21b7a8);padding:5px 0 8px 12px;margin:7px 0';
   item.append(el('strong',null,String(j.status||'Unknown')),el('p','specialistMuted',(j.created_at||j.updated_at||'')+' · '+String(j.question||j.id||'Investigation').slice(0,130)));timeline.append(item)}
  monitoring.append(timeline)
 }
 section.append(monitoring);
 const jobsBox=el('div','specialistForm');jobsBox.append(el('h3',null,'Investigation history and recovery'));
 for(const j of jobs.slice(0,50)){
  const d=el('details','specialistRecord');d.append(el('summary',null,(j.status||'Unknown')+' · '+String(j.question||j.id||'Investigation').slice(0,100)));
  for(const [label,value] of [['Created',j.created_at],['Updated',j.updated_at],['Error',j.error],['Result',j.result_json||j.result]]){
   if(value===null||value===undefined||value==='')continue;
   const p=el('p');p.style.whiteSpace='pre-wrap';p.textContent=label+': '+(typeof value==='string'?value:JSON.stringify(value,null,2));d.append(p)
  }
  if(['failed','interrupted'].includes(j.status)){
   const retry=btn('Recover failed investigation',async()=>{retry.disabled=true;notice.textContent='Requesting recovery…';try{await json(base+'/jobs/'+encodeURIComponent(j.id)+'/recover',{});await reload()}catch(e){notice.textContent=e.message;notice.classList.add('error')}finally{retry.disabled=false}},'btn small');d.append(retry)
  }
  jobsBox.append(d)
 }
 if(!jobs.length)jobsBox.append(el('p','specialistMuted','No investigations saved yet.'));
 if(recovery&&typeof recovery==='object'){
  const detail=el('details','specialistRecord');detail.append(el('summary',null,'Recovery lineage and retry history'));
  const recoveryEntries=Array.isArray(recovery)?recovery:specialistItems(recovery);
  if(recoveryEntries.length&&recoveryEntries[0]!==recovery){
   for(const entry of recoveryEntries.slice(0,30)){
    const record=el('div','specialistRecord');
    for(const [label,keys] of [['Recovery ID',['id','recovery_id']],['Original job',['original_job_id','source_job_id','job_id']],['Retry job',['retry_job_id','new_job_id']],['Status',['status','outcome']],['Time',['created_at','updated_at']],['Reason',['reason','error']]]){
     const key=keys.find(k=>entry[k]!==undefined&&entry[k]!==null);
     if(key)record.append(el('p',null,label+': '+String(entry[key])))
    }
    const extra=el('details');extra.append(el('summary',null,'Complete recovery record'));
    const p=el('pre');p.style.whiteSpace='pre-wrap';p.style.overflowWrap='anywhere';p.textContent=JSON.stringify(entry,null,2);extra.append(p);record.append(extra);detail.append(record)
   }
  }else{
   const p=el('pre');p.style.whiteSpace='pre-wrap';p.style.overflowWrap='anywhere';p.textContent=JSON.stringify(recovery,null,2);detail.append(p)
  }
  jobsBox.append(detail)
 }
 section.append(jobsBox);
 const notifications=el('div','specialistForm');notifications.append(el('h3',null,'Afterlight notices'));
 for(const n of notices.slice(0,50)){
  const d=el('details','specialistRecord');d.append(el('summary',null,(n.is_read?'Read':'Unread')+' · '+(n.title||n.kind||'Notice')));
  for(const key of ['message','body','created_at'])if(n[key])d.append(el('p',null,String(n[key])));
  if(!n.is_read){const mark=btn('Mark as read',async()=>{mark.disabled=true;try{await json(base+'/notices/'+encodeURIComponent(n.id)+'/read',{});await reload()}catch(e){notice.textContent=e.message;notice.classList.add('error')}finally{mark.disabled=false}},'btn small');d.append(mark)}
  notifications.append(d)
 }
 if(!notices.length)notifications.append(el('p','specialistMuted','No monitoring notices yet.'));
 section.append(notifications);
 const unavailable=Object.entries(values).filter(([,v])=>v===null).map(([k])=>k);
 if(unavailable.length){const warning=el('p','status error','Some Afterlight records could not load: '+unavailable.join(', '));section.prepend(warning)}
}
