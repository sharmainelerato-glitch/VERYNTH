<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VERYNTH · Meeting</title><style>:root{font-family:system-ui;color:#eaf7fa;background:#0b101a}body{margin:0;padding:25px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{font-size:22px}button{background:#143946;color:#eaf7fa;border:1px solid #397d84;border-radius:10px;padding:11px;margin:5px;cursor:pointer}button:hover{background:#20525c}#videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin:25px 0}.video{background:#152333;border:1px solid #304455;border-radius:16px;overflow:hidden;padding:12px}video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#050a0f;border-radius:10px}.muted{color:#a3b7c9}#status{white-space:pre-wrap}</style><header><h1>✦ VERYNTH · Live meeting</h1><a href="/team" style="color:#68dfd2">Back to workspace</a></header><p class="muted">Live peer-to-peer audio/video. Recording and Ness transcription are OFF. Ask everyone for consent before recording through a separate approved workflow.</p><div id="controls"><button id="start">Join with camera and microphone</button><button id="audio" disabled>Mute</button><button id="video" disabled>Camera off</button><button id="screen" disabled>Share screen</button><button id="leave" disabled>Leave</button></div><p id="status" role="status">Not connected</p><div id="videos"></div><script>
const params=new URLSearchParams(location.search),wid=params.get('workspace'),rid=params.get('meeting');
const base='/api/team/workspaces/'+encodeURIComponent(wid||'')+'/meetings/'+encodeURIComponent(rid||'');
const status=document.getElementById('status'),videos=document.getElementById('videos');let pid=null,stream=null,screen=null,tick=null;const pcs=new Map(),names=new Map();
const btn=id=>document.getElementById(id);function say(t){status.textContent=t}
async function api(path,method='GET',body){const r=await fetch(base+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
function tile(id,name,media,muted=false){let box=document.getElementById('tile-'+id);if(!box){box=document.createElement('div');box.className='video';box.id='tile-'+id;const label=document.createElement('div');label.textContent=name;box.append(label);const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=muted;box.append(v);videos.append(box)}box.querySelector('video').srcObject=media}
async function signal(to,kind,payload){await api('/signal?pid='+encodeURIComponent(pid),'POST',{recipient:to,kind,payload})}
function peer(id,name){if(pcs.has(id))return pcs.get(id);names.set(id,name);const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pcs.set(id,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)signal(id,'ice',{candidate:e.candidate.toJSON()}).catch(err=>say(err.message))};pc.ontrack=e=>tile(id,names.get(id)||'Participant',e.streams[0]);pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState))say('Connection '+pc.connectionState+' · '+id)};return pc}
async function offer(id,name){const pc=peer(id,name);await pc.setLocalDescription(await pc.createOffer());await signal(id,'offer',{description:pc.localDescription.toJSON()})}
async function handle(m){if(m.kind==='leave'){pcs.get(m.from)?.close();pcs.delete(m.from);document.getElementById('tile-'+m.from)?.remove();return}const pc=peer(m.from,names.get(m.from)||'Participant');if(m.kind==='offer'){await pc.setRemoteDescription(m.payload.description);await pc.setLocalDescription(await pc.createAnswer());await signal(m.from,'answer',{description:pc.localDescription.toJSON()})}else if(m.kind==='answer')await pc.setRemoteDescription(m.payload.description);else if(m.kind==='ice'&&m.payload.candidate){try{await pc.addIceCandidate(m.payload.candidate)}catch(e){say('ICE negotiation: '+e.message)}}}
async function poll(){if(!pid)return;try{const d=await api('/poll?pid='+encodeURIComponent(pid));d.peers.forEach(p=>names.set(p.id,p.name));for(const m of d.messages)await handle(m)}catch(e){say(e.message)}}
btn('start').onclick=async()=>{try{if(!wid||!rid)throw Error('Missing workspace or meeting link');stream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});const joined=await api('/join','POST');pid=joined.participant_id;tile('self','You',stream,true);for(const p of joined.peers)await offer(p.id,p.name);tick=setInterval(poll,1200);await poll();['start','audio','video','screen','leave'].forEach(id=>btn(id).disabled=id==='start');say('Connected · '+joined.name+' · '+joined.peers.length+' other participant(s)')}catch(e){stream?.getTracks().forEach(t=>t.stop());say(e.message)}};
btn('audio').onclick=()=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;btn('audio').textContent=t.enabled?'Mute':'Unmute'}};
btn('video').onclick=()=>{const t=stream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;btn('video').textContent=t.enabled?'Camera off':'Camera on'}};
btn('screen').onclick=async()=>{try{if(screen){screen.getTracks().forEach(t=>t.stop());return}screen=await navigator.mediaDevices.getDisplayMedia({video:true});const track=screen.getVideoTracks()[0];for(const pc of pcs.values()){const sender=pc.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(track)}btn('screen').textContent='Stop sharing';track.onended=async()=>{for(const pc of pcs.values()){const sender=pc.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(stream.getVideoTracks()[0])}screen=null;btn('screen').textContent='Share screen'}}catch(e){say(e.message)}};
async function leave(){clearInterval(tick);if(pid)await api('/leave?pid='+encodeURIComponent(pid),'POST').catch(()=>{});pcs.forEach(p=>p.close());pcs.clear();stream?.getTracks().forEach(t=>t.stop());screen?.getTracks().forEach(t=>t.stop());pid=null;videos.replaceChildren();say('Left meeting');btn('leave').disabled=true}btn('leave').onclick=leave;window.addEventListener('pagehide',()=>{if(pid)navigator.sendBeacon?.(base+'/leave?pid='+encodeURIComponent(pid),new Blob([], {type:'application/json'}))});
</script></html>
