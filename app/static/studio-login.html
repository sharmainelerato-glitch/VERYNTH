<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VERYNTH · Sign in</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:radial-gradient(ellipse 65% 55% at 50% 0%,#124a5560,transparent),#0b111b;color:#ecf4f8;font:14px system-ui,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh;padding:22px;margin:0}.card{width:min(440px,100%);padding:39px;border:1px solid #2c4858;border-radius:22px;background:#142133;box-shadow:0 20px 90px #0008}.icon{width:51px;height:51px;border-radius:14px;background:linear-gradient(135deg,#21aba8,#0b6e85);display:grid;place-items:center;font-size:28px;color:white;margin-bottom:21px}h1{font-size:26px;margin:0 0 7px}p{color:#99b3c0;line-height:1.6;margin:0 0 25px}label{color:#bbcfda;font-size:12px;display:block;margin:17px 0 7px}input{width:100%;border:1px solid #3b5667;border-radius:11px;background:#0e1928;color:white;padding:13px 14px;font:inherit}button{width:100%;padding:13px;color:white;border:1px solid #36a7aa;border-radius:11px;font-weight:700;font-size:14px;background:#148f9b;cursor:pointer;margin-top:23px}details{margin-top:22px;color:#a6dcd8}summary{cursor:pointer}.message{color:#ffc3c7;font-size:12px;min-height:22px;padding-top:12px}a{color:#7fdfd9}</style></head><body><div class="card"><div class="icon">✧</div><h1 id="title">Welcome to VERYNTH</h1><p id="intro">Sign in to your private intelligence workspace.</p><form id="owner"><label for="password">Owner password</label><input id="password" type="password" required minlength="12" autocomplete="current-password"><button>Sign in</button><div class="message" id="ownerStatus" role="alert"></div></form><form id="member" hidden><label for="email">Email address</label><input type="email" id="email" autocomplete="email" required><label for="memberPassword">Password</label><input id="memberPassword" type="password" autocomplete="current-password" minlength="12" required><button>Sign in to workspace</button><div class="message" id="teamStatus" role="alert"></div></form><details id="invitation" hidden><summary>Accept a workspace invitation</summary><form id="accept"><label for="inviteCode">Invitation code</label><input id="inviteCode" required><label for="display">Display name</label><input id="display" required><label for="newPassword">Choose password (12+ characters)</label><input id="newPassword" type="password" minlength="12" required><button>Join workspace</button><div class="message" id="inviteStatus" role="status"></div></form></details></div><script>const team=location.pathname.startsWith('/team');document.getElementById('owner').hidden=team;document.getElementById('member').hidden=!team;document.getElementById('invitation').hidden=!team;document.getElementById('title').textContent=team?'Your team workspace':'Welcome to VERYNTH';document.getElementById('intro').textContent=team?'Sign in to collaborate securely with your team.':'Sign in to your private intelligence workspace.';async function submit(path,data,id,next){let out=document.getElementById(id);out.textContent='';try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});if(!r.ok)throw Error((await r.json().catch(()=>({}))).detail||'Could not complete request');if(next)location.assign(next);else out.style.color='#92f4c9',out.textContent='Invitation accepted. Sign in above.'}catch(e){out.textContent=e.message}}document.getElementById('owner').onsubmit=e=>{e.preventDefault();submit('/auth/login',{password:document.getElementById('password').value},'ownerStatus','/owner/workspace')};document.getElementById('member').onsubmit=e=>{e.preventDefault();submit('/api/team/auth/login',{email:document.getElementById('email').value,password:document.getElementById('memberPassword').value},'teamStatus','/team')};document.getElementById('accept').onsubmit=e=>{e.preventDefault();submit('/api/team/auth/invitations/accept',{token:document.getElementById('inviteCode').value,display_name:document.getElementById('display').value,password:document.getElementById('newPassword').value},'inviteStatus',null)};</script></body></html>
